name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  ACR_NAME: 'acrshcdevspringai158ae4'
  
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'maven'
        
    - name: Run tests
      run: mvn test
      
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
        
    - name: Login to Azure Container Registry
      run: az acr login --name ${{ env.ACR_NAME }}
        
    - name: Build and push Docker image
      run: |
        IMAGE_TAG="${{ env.ACR_NAME }}.azurecr.io/springai-azure-demo:${{ github.sha }}"
        echo "Building image: $IMAGE_TAG"
        docker build -t "$IMAGE_TAG" .
        docker push "$IMAGE_TAG"
        
    - name: Deploy to Azure Container Apps
      uses: azure/container-apps-deploy-action@v1
      with:
        containerAppName: ${{ secrets.CONTAINER_APP_NAME }}
        resourceGroup: ${{ secrets.RESOURCE_GROUP_NAME }}
        imageToDeploy: ${{ env.ACR_NAME }}.azurecr.io/springai-azure-demo:${{ github.sha }}
        
    - name: Azure Logout
      if: always()
      run: az logout
